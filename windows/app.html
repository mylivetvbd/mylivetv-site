<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>My Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{--bg:#040812;--card:#0b1220;--card2:#101b31;--gold:#fbbf24;--txt:#e2e8f0;--mut:#94a3b8;--line:#1e293b;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans Bengali','Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:linear-gradient(180deg,#0a1222,#060b16);border-bottom:1px solid var(--line);}
#logo3d{height:44px;width:44px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(251,191,36,.45));}
header b{font-size:19px;color:#fff;white-space:nowrap;}header b span{color:var(--gold);}
.tab{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 18px;font:700 14px inherit;cursor:pointer;}
.tab.on{background:linear-gradient(135deg,#dc2626,#ea580c);color:#fff;border-color:#fde68a;}
.ico{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:7px 13px;font:700 14px inherit;cursor:pointer;}
.ico.on{border-color:var(--gold);color:var(--gold);}
#q{margin-left:auto;background:var(--card);border:1px solid var(--line);color:#fff;border-radius:999px;padding:8px 16px;font:14px inherit;width:230px;outline:none;}
main{flex:1;overflow:hidden;display:flex;flex-direction:column;}
#crumb{display:none;padding:10px 18px 0;}
#crumb button{background:var(--card);border:1px solid var(--line);color:var(--gold);border-radius:10px;padding:7px 16px;font:800 14px inherit;cursor:pointer;}
#home{flex:1;overflow-y:auto;padding:16px 18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:minmax(118px,auto);gap:12px;align-content:start;}
.catcard{background:linear-gradient(145deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:16px 14px;cursor:pointer;position:relative;min-height:118px;}
.catcard:hover{border-color:var(--gold);transform:translateY(-2px);transition:.15s;}
.catcard .em{font-size:30px;line-height:1;}
.catcard .nm{font-size:15px;font-weight:800;color:#fff;margin-top:8px;line-height:1.45;}
.catcard .ct{font-size:12px;color:var(--mut);margin-top:4px;}
.catcard .lv{color:#34d399;font-weight:700;}
#list{flex:1;overflow-y:auto;padding:16px 18px;display:none;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));grid-auto-rows:minmax(150px,auto);gap:12px;align-content:start;}
.ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 8px;cursor:pointer;text-align:center;min-height:150px;}
.ch:hover{border-color:var(--gold);}
.ch .lgw{width:62px;height:62px;margin:0 auto 7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#1c2b4a,#0a1424);border:2px solid #223455;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.5);}
.ch img{width:46px;height:46px;object-fit:contain;}
.ch .fb{font-size:24px;}
.ch div.nm{font-size:12.5px;font-weight:700;color:#e2e8f0;line-height:1.5;}
.ch em{display:block;font-style:normal;font-size:10.5px;margin-top:4px;color:#64748b;}
.ch em.ok{color:#34d399;}.ch em.bad{color:#f87171;}
.ch.dead{opacity:.42;}
#khela{flex:1;overflow-y:auto;padding:16px;display:none;max-width:760px;margin:0 auto;width:100%;}
.m{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px;}
.m .lg{color:var(--mut);font-size:12px;}.m .tm{font-size:16px;font-weight:800;color:#fff;margin:3px 0 6px;}
.m .chbtn{display:inline-block;background:#0f2540;border:1px solid #1e40af;color:#bae6fd;border-radius:8px;padding:6px 12px;font:700 12.5px inherit;margin:3px 4px 0 0;cursor:pointer;}
#player{position:fixed;inset:0;background:#000;display:none;z-index:100;flex-direction:column;}
#player.mini{inset:auto 14px 14px auto;width:400px;height:260px;border:2px solid var(--gold);border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.7);}
#player video{flex:1;width:100%;background:#000;min-height:0;}
#pbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#060b16;flex-wrap:wrap;}
#pname{font-weight:800;color:var(--gold);font-size:14px;}
#perr{color:#f87171;font-size:12.5px;}
#qual{display:flex;gap:5px;flex-wrap:wrap;}
.qb{background:#0f2540;border:1px solid #1e40af;color:#bae6fd;border-radius:7px;padding:4px 10px;font:700 11.5px inherit;cursor:pointer;}
.qb.on{background:#1e40af;color:#fff;}
#pmini,#pclose{border:0;border-radius:8px;padding:7px 14px;font:800 13px inherit;cursor:pointer;}
#pmini{background:#1e3a8a;color:#dbeafe;margin-left:auto;}
#pclose{background:#7f1d1d;color:#fff;}
#player.mini #qual,#player.mini #perr{display:none;}
#loading{padding:40px;text-align:center;color:var(--mut);width:100%;grid-column:1/-1;}
</style>
</head>
<body>
<header>
  <img id="logo3d" src="https://mylivetv.mirdigitalagency.com/logo.png" onerror="this.style.display='none'">
  <b>My <span>Live</span> TV</b>
  <button class="tab on" id="tabTv">📺 চ্যানেল</button>
  <button class="tab" id="tabKhela">🏏 খেলা</button>
  <a class="tab" style="text-decoration:none;" href="https://mylivetvbd.github.io/mylivetv/studio.html" target="_blank" id="tabStudio">🏟️ 3D স্টুডিও</a>

</header>
<main>
  <div id="crumb"><button id="btnBack">← ফিরে যান</button></div>

  <div id="list"></div>
  <div id="khela"></div>
</main>
<div id="player">
  <div id="pbar"><span id="pname"></span><span id="perr"></span><span id="qual"></span><button id="pmini">🗕 ছোট পর্দা</button><button id="pclose">✕ বন্ধ</button></div>
  <video id="video" controls autoplay></video>
</div>
<script>
var APP_VER='3.0';fetch('https://raw.githubusercontent.com/mylivetvbd/mylivetv-site/main/winver.json?t='+Date.now()).then(function(r){return r.json();}).then(function(v){if(v&&v.version&&v.version!==APP_VER){var d=document.createElement('div');d.style.cssText='background:#78350f;color:#fde68a;padding:10px 14px;text-align:center;font-weight:800;cursor:pointer;font-size:14px;';d.textContent='🔔 নতুন ভার্সন ('+v.version+') এসেছে — এখানে চাপ দিয়ে নামিয়ে নিন';d.onclick=function(){window.open(v.url||'https://mylivetv.mirdigitalagency.com/');};document.body.insertBefore(d,document.body.firstChild);}}).catch(function(){});
var PL='https://raw.githubusercontent.com/mylivetvbd/mylivetv/main/my-channels-master.m3u';
var EV='https://raw.githubusercontent.com/mylivetvbd/mylivetv/main/events.json';
var chans=[], groups={}, gOrder=[], curCat=null, hls=null;
var en=localStorage.getItem('en')==='1';
var hideDead=localStorage.getItem('hideDead')==='1';
var st={}, scanTok=0;

var catEn={
"📰 বাংলা নিউজ":"📰 Bangla News","🎬 বাংলা মুভি":"🎬 Bangla Movies","📼 বাংলা সিরিয়াল":"📼 Bangla Serials",
"🧒 বাংলা কার্টুন":"🧒 Bangla Cartoons","⚾ বেসবল":"⚾ Baseball","🏉 রাগবি":"🏉 Rugby","🏒 হকি":"🏒 Hockey",
"🇧🇩 বাংলা চ্যানেল":"🇧🇩 Bangla Channels","🇮🇳 ইন্ডিয়ান বাংলা":"🇮🇳 Indian Bangla","🇮🇳 হিন্দি চ্যানেল":"🇮🇳 Hindi Channels",
"🇬🇧 ইংলিশ চ্যানেল":"🇬🇧 English Channels","🕌 ধর্মীয় (বাংলা)":"🕌 Islamic (Bangla)","🕉️ ধর্মীয় (হিন্দি)":"🕉️ Devotional (Hindi)",
"⛪ ধর্মীয় (ইংলিশ)":"⛪ Religious (English)","📰 নিউজ":"📰 News","🎬 মুভি":"🎬 Movies","🎵 মিউজিক":"🎵 Music",
"🧒 কিডস":"🧒 Kids","🏏 ক্রিকেট":"🏏 Cricket","⚽ ফুটবল":"⚽ Football","🎾 টেনিস":"🎾 Tennis","🏐 ভলিবল":"🏐 Volleyball",
"🥊 ফাইট স্পোর্টস":"🥊 Fight Sports","🏀 বাস্কেটবল":"🏀 Basketball","🏎️ রেসিং":"🏎️ Racing","⛳ গলফ":"⛳ Golf",
"🏇 ঘোড়দৌড়":"🏇 Horse Racing","🏆 স্পোর্টস মিক্স":"🏆 Sports Mix","📺 জেনারেল":"📺 General","🎭 এন্টারটেইনমেন্ট":"🎭 Entertainment",
"🛐 ধর্মীয় (গ্লোবাল)":"🛐 Religious (Global)","🎵 মিউজিক (গ্লোবাল)":"🎵 Music (Global)","🎬 মুভি (গ্লোবাল)":"🎬 Movies (Global)",
"📰 নিউজ (গ্লোবাল)":"📰 News (Global)","📼 সিরিজ":"📼 Series","🧒 কিডস (গ্লোবাল)":"🧒 Kids (Global)",
"🎥 ডকুমেন্টারি":"🎥 Documentary","🎨 অ্যানিমেশন":"🎨 Animation","🏛️ কালচার":"🏛️ Culture","📚 শিক্ষা":"📚 Education",
"😂 কমেডি":"😂 Comedy","⚖️ লেজিসলেটিভ":"⚖️ Legislative","🎞️ ক্লাসিক":"🎞️ Classic","💅 লাইফস্টাইল":"💅 Lifestyle",
"🛍️ শপিং":"🛍️ Shopping","🏕️ আউটডোর":"🏕️ Outdoor","💼 বিজনেস":"💼 Business","🍳 রান্না":"🍳 Cooking",
"👨‍👩‍👧 ফ্যামিলি":"👨‍👩‍👧 Family","✈️ ভ্রমণ":"✈️ Travel","🚗 অটো":"🚗 Auto","⛅ আবহাওয়া":"⛅ Weather",
"🔬 বিজ্ঞান":"🔬 Science","🧘 রিল্যাক্স":"🧘 Relax","📡 অন্যান্য":"📡 Others"};
function t(bn,e){ return en?e:bn; }
function dn(g){
  if(!en) return g;
  if(catEn[g]) return catEn[g];
  var m=/^(.*) (\d+)$/.exec(g);
  if(m&&catEn[m[1]]) return catEn[m[1]]+' '+m[2];
  return g;
}
function applyLang(){
  document.getElementById('btnLang').textContent=en?'বাং':'EN';
  document.getElementById('tabTv').textContent=t('📺 চ্যানেল','📺 Channels');
  document.getElementById('tabKhela').textContent=t('🏏 খেলা','🏏 Sports');
  document.getElementById('tabStudio').textContent=t('🏟️ 3D স্টুডিও','🏟️ 3D Studio');
  document.getElementById('q').placeholder=t('🔍 চ্যানেল খুঁজুন...','🔍 Search channels...');
  document.getElementById('btnBack').textContent='← '+(curCat?dn(curCat):t('ফিরে যান','Back'));
}
function rank(c){ var s=st[c.u]; return s===1?0:(s===-1?2:1); }
function checkCh(u){
  return new Promise(function(res){
    var ac=new AbortController();
    var tm=setTimeout(function(){ ac.abort(); }, 5000);
    fetch(u,{signal:ac.signal}).then(function(r){
      clearTimeout(tm);
      if(!r.ok){ res(false); return; }
      if(u.indexOf('.m3u8')>=0){
        r.text().then(function(x){ res(x.indexOf('#EXT')>=0); }, function(){ res(false); });
      } else { res(true); ac.abort(); }
    }, function(){ clearTimeout(tm); res(false); });
  });
}
function scanVisible(arr){
  var tok=++scanTok, pend=[];
  arr.forEach(function(c,i){ if(st[c.u]===undefined) pend.push([c,i]); });
  if(!pend.length) return;
  var p=0, act=0, dirty=false;
  function mark(i,ok){
    if(tok!==scanTok) return;
    var d=document.querySelector('.ch[data-i="'+i+'"]'); if(!d) return;
    var em=d.querySelector('em'); if(!em) return;
    if(ok){ em.className='ok'; em.textContent=t('🟢 লাইভ','🟢 Live'); }
    else { em.className='bad'; em.textContent=t('⛔ বন্ধ','⛔ Off'); d.classList.add('dead'); }
  }
  function next(){
    if(tok!==scanTok) return;
    if(p>=pend.length){ if(act===0 && dirty){ scanTok++; render(); } return; }
    var item=pend[p++]; act++;
    checkCh(item[0].u).then(function(ok){
      st[item[0].u]=ok?1:-1;
      if(!ok) dirty=true;
      mark(item[1],ok);
      act--; next();
    });
  }
  for(var k=0;k<12 && k<pend.length;k++) next();
}
function parseM3U(text){
  var out=[], name='', grp='', logo='';
  var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var l=lines[i].trim();
    if(l.indexOf('#EXTINF')===0){
      var g=/group-title="([^"]*)"/.exec(l); grp=g?g[1]:'📡 অন্যান্য';
      var lg=/tvg-logo="([^"]*)"/.exec(l); logo=lg?lg[1]:'';
      name=l.split(',').pop().trim();
    } else if(l && l.indexOf('#')!==0 && name){
      out.push({n:name, g:grp, l:logo, u:l.split('|')[0]});
      name='';
    }
  }
  return out;
}
function buildGroups(){
  groups={}; gOrder=[];
  chans.forEach(function(c){
    if(!groups[c.g]){ groups[c.g]=[]; gOrder.push(c.g); }
    groups[c.g].push(c);
  });
}
function catEmoji(g){ var m=g.match(/^\S+/); return m?m[0]:'📺'; }
function render(){
  var q=document.getElementById('q').value.trim().toLowerCase();
  var home=document.getElementById('home'), list=document.getElementById('list');
  if(q){
    var arr=chans.filter(function(c){ return c.n.toLowerCase().indexOf(q)>=0; });
    if(hideDead) arr=arr.filter(function(c){ return st[c.u]!==-1; });
    arr.sort(function(a,b){ return rank(a)-rank(b); });
    arr=arr.slice(0,300);
    home.style.display='none'; list.style.display='grid';
    document.getElementById('crumb').style.display='none';
    drawChannels(arr,list);
  } else if(curCat===null){
    home.style.display='grid'; list.style.display='none';
    document.getElementById('crumb').style.display='none';
    var h='';
    gOrder.forEach(function(g){
      var l=groups[g], live=l.filter(function(c){return st[c.u]===1;}).length;
      h+='<div class="catcard" data-g="'+encodeURIComponent(g)+'"><div class="em">'+catEmoji(g)+'</div><div class="nm">'+dn(g)+'</div><div class="ct">'+l.length+' '+t('চ্যানেল','channels')+(live?' • <span class="lv">🟢 '+live+' '+t('লাইভ','live')+'</span>':'')+'</div></div>';
    });
    home.innerHTML=h||'<div id="loading">'+t('কিছু পাওয়া যায়নি','Nothing found')+'</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.catcard'),function(d){
      d.onclick=function(){ curCat=decodeURIComponent(d.getAttribute('data-g')); render(); window.scrollTo(0,0); };
    });
  } else {
    var arr=(groups[curCat]||[]).slice();
    if(hideDead) arr=arr.filter(function(c){ return st[c.u]!==-1; });
    arr.sort(function(a,b){ return rank(a)-rank(b); });
    home.style.display='none'; list.style.display='grid';
    document.getElementById('crumb').style.display='block';
    document.getElementById('btnBack').textContent='← '+dn(curCat);
    drawChannels(arr,list);
  }
}
function drawChannels(arr,list){
  var h='';
  arr.forEach(function(c,i){
    var s=st[c.u];
    var tag = s===1 ? '<em class="ok">'+t('🟢 লাইভ','🟢 Live')+'</em>' : (s===-1 ? '<em class="bad">'+t('⛔ বন্ধ','⛔ Off')+'</em>' : '<em>'+t('⏳ পরীক্ষা...','⏳ Checking...')+'</em>');
    var lg = c.l ? '<img src="'+c.l+'" loading="lazy" onerror="this.outerHTML=\'<span class=fb>📺</span>\'">' : '<span class="fb">📺</span>';
    h+='<div class="ch'+(s===-1?' dead':'')+'" data-i="'+i+'"><div class="lgw">'+lg+'</div><div class="nm">'+c.n+'</div>'+tag+'</div>';
  });
  list.innerHTML=h||'<div id="loading">'+t('কিছু পাওয়া যায়নি','Nothing found')+'</div>';
  Array.prototype.forEach.call(list.querySelectorAll('.ch'),function(d){
    d.onclick=function(){ var c=arr[parseInt(d.getAttribute('data-i'))]; play(c.n,c.u); };
  });
  scanVisible(arr);
}
function setQualButtons(){
  var qd=document.getElementById('qual'); qd.innerHTML='';
  if(!hls||!hls.levels||hls.levels.length<2) return;
  function qb(label,lv){
    var b=document.createElement('button'); b.className='qb'+(hls.currentLevel===lv||(lv===-1&&hls.autoLevelEnabled)?' on':'');
    b.textContent=label;
    b.onclick=function(){ hls.currentLevel=lv; setQualButtons(); };
    qd.appendChild(b);
  }
  qb(t('অটো','Auto'),-1);
  hls.levels.forEach(function(l,i){ qb((l.height||Math.round(l.bitrate/1000))+'p',i); });
}
function play(name,url){
  var pl=document.getElementById('player');
  pl.style.display='flex'; pl.classList.remove('mini');
  document.getElementById('pname').textContent=name;
  document.getElementById('perr').textContent='';
  document.getElementById('qual').innerHTML='';
  var v=document.getElementById('video');
  if(hls){ hls.destroy(); hls=null; }
  if(url.indexOf('.m3u8')>=0 && window.Hls && Hls.isSupported()){
    hls=new Hls({maxBufferLength:20});
    hls.loadSource(url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){ setQualButtons(); });
    hls.on(Hls.Events.LEVEL_SWITCHED,function(){ setQualButtons(); });
    hls.on(Hls.Events.ERROR,function(e,d){
      if(d.fatal){
        document.getElementById('perr').textContent=t('⚠️ চ্যানেলটি এই মুহূর্তে বন্ধ — অন্যটা দেখুন','⚠️ Channel is off right now — try another');
        st[url]=-1;
      }
    });
  } else { v.src=url; }
  v.onerror=function(){
    if(pl.style.display==='flex'){
      document.getElementById('perr').textContent=t('⚠️ চ্যানেলটি এই মুহূর্তে বন্ধ — অন্যটা দেখুন','⚠️ Channel is off right now — try another');
      st[url]=-1;
    }
  };
  v.play().catch(function(){});
}
document.getElementById('pclose').onclick=function(){
  var v=document.getElementById('video');
  v.pause(); v.src='';
  if(hls){ hls.destroy(); hls=null; }
  var pl=document.getElementById('player');
  pl.style.display='none'; pl.classList.remove('mini');
};
document.getElementById('pmini').onclick=function(){
  var pl=document.getElementById('player');
  pl.classList.toggle('mini');
  this.textContent=pl.classList.contains('mini')?t('⛶ বড় পর্দা','⛶ Full view'):t('🗕 ছোট পর্দা','🗕 Mini view');
};
document.getElementById('btnBack').onclick=function(){ curCat=null; render(); };
document.getElementById('btnEye').onclick=function(){
  hideDead=!hideDead; localStorage.setItem('hideDead',hideDead?'1':'0');
  this.classList.toggle('on',hideDead); render();
};
document.getElementById('btnLang').onclick=function(){
  en=!en; localStorage.setItem('en',en?'1':'0'); applyLang(); render();
};
document.getElementById('q').oninput=render;
document.getElementById('tabTv').onclick=function(){
  this.classList.add('on'); document.getElementById('tabKhela').classList.remove('on');
  document.getElementById('khela').style.display='none';
  render();
};
document.getElementById('tabKhela').onclick=function(){
  this.classList.add('on'); document.getElementById('tabTv').classList.remove('on');
  document.getElementById('home').style.display='none';
  document.getElementById('list').style.display='none';
  document.getElementById('crumb').style.display='none';
  document.getElementById('khela').style.display='block';
  loadKhela();
};
var BN={'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
function bnNum(s){ return String(s).replace(/[0-9]/g,function(d){return BN[d];}); }
function bdTime(ts){
  var d=new Date((ts+21600)*1000);
  var h=d.getUTCHours(), m=d.getUTCMinutes();
  var ap=h<4?'রাত':h<6?'ভোর':h<12?'সকাল':h<15?'দুপুর':h<18?'বিকাল':h<20?'সন্ধ্যা':'রাত';
  var h12=h%12||12;
  return ap+' '+bnNum(h12)+':'+bnNum((m<10?'0':'')+m)+' ('+bnNum(d.getUTCDate())+'/'+bnNum(d.getUTCMonth()+1)+')';
}
function loadKhela(){
  var k=document.getElementById('khela');
  k.innerHTML='<div id="loading">'+t('⏳ খেলার সূচি আসছে...','⏳ Loading match schedule...')+'</div>';
  fetch(EV+'?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    var h='<h2 style="color:var(--gold);margin-bottom:12px;">'+t('🏏 আজকের ও আগামী খেলা','🏏 Today & upcoming matches')+'</h2>';
    (d.events||[]).sort(function(a,b){return a.t-b.t;}).forEach(function(e,ei){
      var badge = e.st==='in' ? '<span style="color:#f87171;font-weight:800;">'+t('🔴 চলছে','🔴 LIVE')+'</span>' : (e.st==='post' ? '<span style="color:#64748b;">'+t('✔ শেষ','✔ Finished')+'</span>' : bdTime(e.t));
      var cb=''; (e.ch||[]).forEach(function(c,ci){ cb+='<span class="chbtn" data-e="'+ei+'" data-c="'+ci+'">▶ '+c.n+'</span>'; });
      h+='<div class="m"><div class="lg">'+(e.sp==='c'?'🏏':'⚽')+' '+(e.lg||'')+'</div><div class="tm">'+e.h+' vs '+e.a+'</div><div style="font-size:13.5px;">'+badge+'</div>'+(cb?'<div style="margin-top:7px;">'+cb+'</div>':'')+(e.note?'<div style="color:var(--gold);font-size:12px;margin-top:5px;">ℹ️ '+e.note+'</div>':'')+'</div>';
    });
    k.innerHTML=h;
    window.__ev=d.events;
    Array.prototype.forEach.call(document.querySelectorAll('.chbtn'),function(b){
      b.onclick=function(){
        var e=window.__ev[parseInt(b.getAttribute('data-e'))];
        var c=e.ch[parseInt(b.getAttribute('data-c'))];
        play(c.n, c.u.split('|')[0]);
      };
    });
  }).catch(function(){ k.innerHTML='<div id="loading">'+t('সূচি আনা গেল না — ইন্টারনেট দেখুন','Could not load — check internet')+'</div>'; });
}
if(hideDead) document.getElementById('btnEye').classList.add('on');
applyLang();
fetch(PL+'?t='+Date.now()).then(function(r){return r.text();}).then(function(txt){
  chans=parseM3U(txt);
  buildGroups();
  render();
}).catch(function(){
  document.getElementById('home').innerHTML='<div id="loading">'+t('তালিকা আনা গেল না — ইন্টারনেট সংযোগ দেখে অ্যাপটি আবার খুলুন','Could not load — check internet and reopen the app')+'</div>';
});
</script>
