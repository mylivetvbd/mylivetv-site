name: Speed Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pillow
        run: pip install pillow

      - name: Apply speed fixes
        run: |
          python3 << 'EOF'
          import glob
          from PIL import Image
          SPEC = '<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"eager"}],"prerender":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>'
          ANCHOR = "gtag('config','G-MP1LHB6N0R');</script>"
          files = glob.glob('*.html') + glob.glob('blog/*.html') + glob.glob('archive/*.html') + ['gen_site.py']
          for f in files:
              s = open(f, encoding='utf-8').read()
              if ANCHOR in s and 'speculationrules' not in s:
                  s = s.replace(ANCHOR, ANCHOR + '\n' + SPEC, 1)
                  open(f, 'w', encoding='utf-8').write(s)
                  print('patched:', f)
          im = Image.open('logo.png').convert('RGBA')
          if im.width > 200:
              im = im.resize((160, 160), Image.LANCZOS)
              im.quantize(colors=256, method=2).save('logo.png', optimize=True)
              print('logo shrunk')
          EOF

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "⚡ স্পিড ফিক্স"
          git push
