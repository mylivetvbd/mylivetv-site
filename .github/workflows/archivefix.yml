name: Archive Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch gen_site
        run: |
          python3 << 'PYEOF'
          s = open('gen_site.py', encoding='utf-8').read()
          A1 = 'base = base_url()\n    body = f"""<h1>🏏'
          N1 = '''base = base_url()
              arc = sorted(glob.glob("archive/*.html"), reverse=True)[:10]
              arc_html = ''.join(f'<a href="{a}" style="color:#93c5fd;display:inline-block;margin:4px 12px 4px 0;">\U0001F4C5 {a[14:24]}</a>' for a in arc)
              body = f"""<h1>\U0001F3CF'''
          A2 = '<p class="lead" style="margin-top:18px;">সূত্র:'
          N2 = '''{('<h2>আগের দিনের সূচি</h2><p class="lead">' + arc_html + '</p>') if arc_html else ''}
          <p class="lead" style="margin-top:18px;">সূত্র:'''
          A3 = """.replace('href="blog.html', 'href="../blog.html')"""
          N3 = A3 + """.replace('href="archive/', 'href="../archive/')"""
          assert s.count(A1)==1 and s.count(A2)==1 and s.count(A3)==1
          assert 'আগের দিনের সূচি' not in s
          s = s.replace(A1, N1, 1).replace(A2, N2, 1).replace(A3, N3, 1)
          open('gen_site.py', 'w', encoding='utf-8').write(s)
          print('patched')
          PYEOF

      - name: Rebuild pages
        run: python3 gen_site.py

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "📅 আগের দিনের সূচি দৃশ্যমান"
          git push
