name: winbuild4
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: update app source
        shell: bash
        run: |
          set -e
          curl -sL --retry 3 -o apphtml2.txt https://d.uguu.se/wURwWmuV.txt
          echo "7e431531c11259e5ff46ef127b6afd3d  apphtml2.txt" | md5sum -c -
          base64 -di apphtml2.txt > windows/app.html
          echo "526dde4c44713fbfd416d9d590134b1c  windows/app.html" | md5sum -c -
          rm apphtml2.txt
          git config user.name mylivetvbd
          git config user.email mylivetvbd@users.noreply.github.com
          git add windows/app.html
          git diff --cached --quiet || git commit -m "Windows v3.1: language-wise categories"
          git push || true
      - name: package
        shell: pwsh
        run: |
          cd windows
          npm install --no-audit --loglevel=error
          npx electron-packager . "MyLiveTV" --platform=win32 --arch=x64 --out=dist --overwrite
          Compress-Archive -Path dist/MyLiveTV-win32-x64 -DestinationPath ../MyLiveTV-Windows-v3.1.zip -Force
      - name: release and update links
        shell: bash
        run: |
          set -e
          gh release view windows-v3.1 >/dev/null 2>&1 || gh release create windows-v3.1 MyLiveTV-Windows-v3.1.zip --title "My Live TV - Windows v3.1" --notes "Unzip and run MyLiveTV.exe"
          gh release upload windows-v3.1 MyLiveTV-Windows-v3.1.zip --clobber
          printf '{"version": "3.1", "url": "https://github.com/mylivetvbd/mylivetv-site/releases/download/windows-v3.1/MyLiveTV-Windows-v3.1.zip"}' > winver.json
          python3 -c "import json; d=json.load(open('winver.json')); assert d['version']=='3.1'; print('winver OK')"
          sed -i 's#windows-v2.0/MyLiveTV-Windows-v2.0.zip#windows-v3.1/MyLiveTV-Windows-v3.1.zip#g; s#windows-v3.0/MyLiveTV-Windows-v3.0.zip#windows-v3.1/MyLiveTV-Windows-v3.1.zip#g' index.html
          grep -c "windows-v3.1" index.html
          git add winver.json index.html
          git diff --cached --quiet || git commit -m "Windows v3.1 release links"
          git push || (git pull --rebase --autostash && git push)
          echo ALL-DONE
