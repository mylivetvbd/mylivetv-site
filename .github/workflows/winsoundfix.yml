name: Win Sound Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch main.js
        run: |
          python3 << 'PYEOF'
          s = open('windows/main.js', encoding='utf-8').read()
          A1 = "const { app, BrowserWindow, shell } = require('electron');"
          N1 = A1 + "\nconst { exec } = require('child_process');"
          A2 = """  // বাইরের লিংক (স্টুডিও ইত্যাদি) ডিফল্ট ব্রাউজারে খুলবে
            win.webContents.setWindowOpenHandler(({ url }) => {
              shell.openExternal(url);
              return { action: 'deny' };
            });"""
          A2 = A2.replace('\n            ', '\n  ')
          N2 = """  // বাইরের লিংক খোলা: স্টুডিও হলে Edge-এ (বাংলা কণ্ঠ Edge-এই আছে)
            const openOutside = (url) => {
              if (process.platform === 'win32' && url.indexOf('studio') >= 0) {
                exec('start msedge "' + url + '"', (err) => { if (err) shell.openExternal(url); });
              } else {
                shell.openExternal(url);
              }
            };
            win.webContents.setWindowOpenHandler(({ url }) => {
              openOutside(url);
              return { action: 'deny' };
            });"""
          N2 = N2.replace('\n            ', '\n  ').replace('\n    exec', '\n      exec').replace('\n    } else', '\n    } else')
          A3 = "if (url.indexOf('http') === 0) { e.preventDefault(); shell.openExternal(url); }"
          N3 = "if (url.indexOf('http') === 0) { e.preventDefault(); openOutside(url); }"
          assert s.count(A1) == 1 and s.count(A2) == 1 and s.count(A3) == 1
          s = s.replace(A1, N1, 1).replace(A2, N2, 1).replace(A3, N3, 1)
          open('windows/main.js', 'w', encoding='utf-8').write(s)
          print('patched')
          PYEOF

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🔊 স্টুডিও সাউন্ড ফিক্স"
          git push

      - name: Rebuild Windows app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run winbuild.yml --ref main -R ${{ github.repository }}
