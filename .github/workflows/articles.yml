name: Article Bank

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download articles
        run: |
          curl -sL "https://h.uguu.se/gTZkGhCe.txt" | base64 -d > bank.zip
          echo "be1ece37a80d59cebae54c62896d0cf0  bank.zip" | md5sum -c -
          unzip -o bank.zip
          rm -f bank.zip
          ls draft-*.html

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "নতুন ১৭টি আর্টিকেল যোগ"
          git push
