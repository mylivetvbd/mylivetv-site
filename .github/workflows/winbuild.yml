name: Build Windows App

on:
  workflow_dispatch:   # হাতে চালানোর বাটন

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Package Windows app
        run: |
          cd windows
          npm install --no-audit --loglevel=error
          npx electron-packager . "MyLiveTV" --platform=win32 --arch=x64 --out=dist --overwrite
          cd dist
          zip -qr ../../MyLiveTV-Windows-v2.0.zip MyLiveTV-win32-x64

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v2.0
          name: My Live TV — Windows v2.0
          body: "🖥️ My Live TV Windows ভার্সন — আনজিপ করে MyLiveTV.exe চালান"
          files: MyLiveTV-Windows-v2.0.zip
