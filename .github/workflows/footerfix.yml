name: Footer Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply footer fix
        run: |
          python3 << 'EOF'
          import glob
          SNIP = '<style>footer{text-align:center!important;padding:26px 14px 32px!important;line-height:2.1!important;font-size:13px!important}footer a{white-space:nowrap}</style>'
          ANCHOR = '"eagerness":"moderate"}]}</script>'
          for f in glob.glob('*.html') + glob.glob('blog/*.html') + glob.glob('archive/*.html') + ['gen_site.py']:
              s = open(f, encoding='utf-8').read()
              if ANCHOR in s and 'footer{text-align:center' not in s:
                  s = s.replace(ANCHOR, ANCHOR + '\n' + SNIP, 1)
                  open(f, 'w', encoding='utf-8').write(s)
                  print('patched:', f)
          EOF

      - name: Commit & push
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "🎨 ফুটার মাঝ-বরাবর"
          git push
